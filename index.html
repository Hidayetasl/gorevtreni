<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Ana ekrana eklenince Safari çubukları olmadan, tam ekran uygulama gibi açılır -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Görev Treni" />
    <meta name="theme-color" content="#0e9aa7" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <title>Rüzgar'ın Görev Treni 🚂✨</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  </head>
  <body style="margin:0;background:#e3eee9">
    <!-- Uygulama kodu yüklenene kadar görünür; React yükleyince yerine geçer. Beyaz ekran kalmaz. -->
    <div id="root"><div id="boot" style="min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-family:ui-rounded,system-ui,-apple-system,sans-serif;color:#16323a;text-align:center;padding:24px"><div style="font-size:56px">🚂</div><div id="boot-msg" style="font-size:18px;font-weight:800">Açılıyor…</div></div></div>
    <script>
      setTimeout(function () {
        var msg = document.getElementById('boot-msg');
        if (!msg) return;
        msg.innerHTML = 'Uygulama yüklenemedi.<br><span style="font-weight:600;font-size:15px">İnternet bağlantısını kontrol edin.</span><br><button onclick="location.reload()" style="margin-top:14px;min-height:50px;padding:0 22px;border:0;border-radius:16px;background:#0e9aa7;color:#fff;font:800 17px system-ui">Yeniden dene</button>';
      }, 12000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
